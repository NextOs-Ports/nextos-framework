# O OpenAL Soft aqui e EMBUTIDO na libgame.so (build Android) e a unica saida
# que o so-loader serve e a **OpenSL ES** -- o shim do loader a converte em
# audio SDL2.  Este arquivo existe por dois motivos, nessa ordem:
#
#  1. IMPEDIR que o alsoft.conf do firmware entre.  A licao da casa
#     (audio.embedded-openal) e que o arquivo da CFW muta OpenAL embutido.
#  2. Cravar `drivers = opensl`.  Medido em 23/08/2026: com
#     `drivers = pulse,alsa` o OpenAL nem tenta o OpenSL, o shim nunca abre o
#     dispositivo e o jogo roda MUDO -- sem uma linha de erro no log.
[general]
drivers = opensl
period_size = 1024
periods = 4
stereo-mode = speakers

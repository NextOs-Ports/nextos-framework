# OpenAL Soft -- universal audio config, same recipe as the approved Bully port.
#
# 'drivers' pins the backend order instead of leaving OpenAL Soft's built-in
# list.  OpenAL Soft picks ONE playback factory at library init -- the first
# whose init() succeeds -- and never reconsiders, so a firmware whose PipeWire
# backend cannot start (missing client.conf) drops straight through to raw ALSA
# even when a sound server owns the card.  The pinned order keeps the server
# backends ahead of raw ALSA and keeps exotic ones out of the running.
#  - pipewire: native stream where the backend is built and working; the server
#    owns the PCM, so a DRM modeset by the game never freezes it.
#  - pulse: PulseAudio and pipewire-pulse boxes (Amlogic Mali-450 NextOS).
#  - alsa: ALSA-only firmwares (R36S/ArkOS); last resort.
# It only orders backends OpenAL Soft already has and never forces one.
[general]
drivers = pipewire,pulse,alsa

# Raw ALSA: the mmap path stalls with "mmap commit error: Broken pipe" on
# RK3326-class handhelds -- the fix the approved Bully port ships.  Release
# 1.0.0 applied this file only on firmwares without a PulseAudio socket, so the
# boxes that fell through to ALSA anyway (PipeWire backend failing, as in the
# tester log) ran on the mmap path with no fix at all.
[alsa]
mmap = false

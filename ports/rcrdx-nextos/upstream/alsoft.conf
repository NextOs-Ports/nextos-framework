# alsoft.conf do RCRDX — INCONDICIONAL, como manda a regra da casa.
#
# ⚠️ Este jogo NÃO usa OpenAL: a SDL2 embutida abre áudio pelo caminho Java
# (AudioTrack), que o loader atende com um device do SDL2 DO SISTEMA. O arquivo
# fica aqui mesmo assim porque qualquer biblioteca que apareça no processo e
# procure um openal-soft tem de encontrar uma configuração sã em vez de sair
# caçando backend — o modo de falha do OpenAL é rodar MUDO sem reclamar.
#
# A lista é a do sistema (nunca `opensl`, que não existe fora do Android), e
# `null` fica como último recurso EXPLÍCITO, para aparecer no log.
[general]
drivers = pipewire,pulse,alsa,null
period_size = 1024
periods = 4
stereo-mode = speakers

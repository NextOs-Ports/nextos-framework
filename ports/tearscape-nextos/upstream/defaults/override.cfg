; NextOS Mali-450 render profile.
; The project authors a 2560x1440 logical viewport with stretch/mode=viewport,
; so the engine renders 3.7 Mpx per frame before scaling. On this GPU that
; starves both the frame time and the ALSA buffer. 640x360 is the integer
; scale of the game's 320x180 pixel art: every panel (480p and 720p alike)
; upscales one small, cheap frame — the R2-proven behaviour. On a 720p panel
; the old 1280x720 profile pushed 4.5x the pixels and stuttered.
[display]

window/size/viewport_width=640
window/size/viewport_height=360
; Fill every panel, whatever its aspect. The game derives camera zoom from
; the VIEWPORT height (Camera::InitZoom = viewport.y/144), so the logical
; 640x360 view must stay identical on all devices; "ignore" lets Godot
; stretch that same view to the real window (16:9 panels: no-op; 4:3
; panels: fills instead of letterboxing). "expand" is forbidden here: it
; grows the viewport and the height-driven zoom explodes (proved on 4:3).
window/stretch/aspect="ignore"

[audio]

driver/output_latency=60
